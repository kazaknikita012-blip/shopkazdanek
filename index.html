<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Каталог — Жижи и Поды</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #0f172a);
      --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
      --text-color: var(--tg-theme-text-color, #f8fafc);
      --hint-color: var(--tg-theme-hint-color, #94a3b8);
      --accent: var(--tg-theme-button-color, #38bdf8);
      --accent-text: var(--tg-theme-button-text-color, #0f172a);
      --border-color: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background: var(--bg-color); color: var(--text-color); padding: 12px 12px 90px 12px; }
    
    /* Header */
    .header { margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 20px; font-weight: 700; color: #fff; }
    .cart-badge { background: var(--accent); color: var(--accent-text); font-weight: 700; padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; }

    /* Controls */
    .search-box { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--card-bg); color: #fff; font-size: 15px; margin-bottom: 10px; outline: none; }
    .search-box:focus { border-color: var(--accent); }
    
    .tabs { display: flex; gap: 8px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 4px; }
    .tab { padding: 8px 14px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer; color: var(--hint-color); }
    .tab.active { background: var(--accent); color: var(--accent-text); font-weight: 600; border-color: var(--accent); }
    
    .brand-filter { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--card-bg); color: #fff; font-size: 14px; margin-bottom: 14px; outline: none; }

    /* Stats */
    .counter-text { font-size: 13px; color: var(--hint-color); margin-bottom: 10px; }

    /* Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .card { background: var(--card-bg); border-radius: 14px; border: 1px solid var(--border-color); padding: 12px; display: flex; flex-direction: column; justify-content: space-between; transition: 0.15s; }
    .card-top { margin-bottom: 8px; }
    .card-tag { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
    .card-title { font-size: 14px; font-weight: 600; line-height: 1.25; margin-bottom: 4px; color: #fff; }
    .card-flavor { font-size: 12px; color: var(--hint-color); margin-bottom: 6px; }
    .card-art { font-size: 11px; color: #64748b; }
    .card-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.06); }
    .card-price { font-size: 15px; font-weight: 700; color: #38df8f; }
    .add-btn { background: var(--accent); color: var(--accent-text); border: none; border-radius: 8px; width: 30px; height: 30px; font-size: 18px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    
    /* Cart Modal / Bar */
    .checkout-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #0b1120; border-top: 1px solid var(--border-color); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
    .checkout-info { display: flex; flex-direction: column; }
    .checkout-total { font-size: 16px; font-weight: 700; color: #fff; }
    .checkout-count { font-size: 12px; color: var(--hint-color); }
    .send-order-btn { background: #10b981; color: #fff; border: none; font-size: 14px; font-weight: 700; padding: 10px 18px; border-radius: 10px; cursor: pointer; }

    /* Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 200; padding: 16px; align-items: center; justify-content: center; }
    .modal.open { display: flex; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; width: 100%; max-width: 440px; max-height: 80vh; display: flex; flex-direction: column; padding: 16px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .modal-body { overflow-y: auto; flex: 1; margin-bottom: 12px; }
    .cart-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border-color); font-size: 13px; }
    .cart-row-title { font-weight: 600; color: #fff; max-width: 60%; }
    .cart-qty-ctrl { display: flex; gap: 8px; align-items: center; }
    .qty-btn { background: #334155; border: none; color: #fff; width: 24px; height: 24px; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
</head>

    let currentCategory = 'Все';
    let cart = {};

    // Init Brand select
    const brandsSet = [...new Set(PRODUCTS.map(p => p.brand))].sort();
    const brandSelect = document.getElementById('brandSelect');
    brandsSet.forEach(b => {
      const opt = document.createElement('option');
      opt.value = b;
      opt.textContent = b;
      brandSelect.appendChild(opt);
    });

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.tab').forEach(t => {
        t.classList.toggle('active', t.textContent.startsWith(cat));
      });
      filterProducts();
    }

    function renderProducts(list) {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = '';
      document.getElementById('counterText').textContent = `Показано: ${list.length} позиций`;

      // Render limited batch for instant performance (first 100, then lazy load if needed)
      list.slice(0, 150).forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-top">
            <div class="card-tag">${p.brand} ${p.puffs ? '• ' + p.puffs + ' тяг' : ''}</div>
            <div class="card-title">${p.series}</div>
            <div class="card-flavor">Вкус: ${p.flavor}</div>
            <div class="card-art">Арт: ${p.art}</div>
          </div>
          <div class="card-bottom">
            <div class="card-price">${p.price.toFixed(2)} Br</div>
            <button class="add-btn" onclick="addToCart('${p.id}')">+</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const selectedBrand = document.getElementById('brandSelect').value;

      const filtered = PRODUCTS.filter(p => {
        const matchCat = currentCategory === 'Все' || p.cat === currentCategory;
        const matchBrand = !selectedBrand || p.brand === selectedBrand;
        const matchQuery = !query || 
          p.flavor.toLowerCase().includes(query) || 
          p.series.toLowerCase().includes(query) || 
          p.brand.toLowerCase().includes(query) ||
          p.art.toLowerCase().includes(query);
        return matchCat && matchBrand && matchQuery;
      });

      renderProducts(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', filterProducts);

    function addToCart(id) {
      cart[id] = (cart[id] || 0) + 1;
      updateCartUI();
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function changeQty(id, delta) {
      cart[id] = (cart[id] || 0) + delta;
      if (cart[id] <= 0) delete cart[id];
      updateCartUI();
      renderCartModal();
    }

    function updateCartUI() {
      const totalCount = Object.values(cart).reduce((a, b) => a + b, 0);
      let totalPrice = 0;
      for (const [id, qty] of Object.entries(cart)) {
        const prod = PRODUCTS.find(p => p.id === id);
        if (prod) totalPrice += prod.price * qty;
      }

      document.getElementById('cartBadge').textContent = `Корзина: ${totalCount}`;
      const checkoutBar = document.getElementById('checkoutBar');
      if (totalCount > 0) {
        checkoutBar.style.display = 'flex';
        document.getElementById('barTotal').textContent = totalPrice.toFixed(2) + ' Br';
        document.getElementById('barCount').textContent = totalCount + ' шт.';
      } else {
        checkoutBar.style.display = 'none';
      }
    }

    function openCart() {
      renderCartModal();
      document.getElementById('cartModal').classList.add('open');
    }

    function closeCart() {
      document.getElementById('cartModal').classList.remove('open');
    }

    function renderCartModal() {
      const list = document.getElementById('cartItemsList');
      list.innerHTML = '';
      let totalPrice = 0;
      const entries = Object.entries(cart);
      if (entries.length === 0) {
        list.innerHTML = '<div style="color:#94a3b8; text-align:center; padding:20px;">Корзина пуста</div>';
      } else {
        entries.forEach(([id, qty]) => {
          const prod = PRODUCTS.find(p => p.id === id);
          if (!prod) return;
          const sum = prod.price * qty;
          totalPrice += sum;
          const row = document.createElement('div');
          row.className = 'cart-row';
          row.innerHTML = `
            <div class="cart-row-title">${prod.series}<br><span style="font-weight:normal;color:#94a3b8;">${prod.flavor}</span></div>
            <div class="cart-qty-ctrl">
              <button class="qty-btn" onclick="changeQty('${id}', -1)">-</button>
              <span style="color:#fff; min-width:18px; text-align:center;">${qty}</span>
              <button class="qty-btn" onclick="changeQty('${id}', 1)">+</button>
              <span style="color:#38df8f; font-weight:bold; min-width:55px; text-align:right;">${sum.toFixed(2)} Br</span>
            </div>
          `;
          list.appendChild(row);
        });
      }
      document.getElementById('modalTotal').textContent = totalPrice.toFixed(2) + ' Br';
    }

    function submitOrder() {
      const entries = Object.entries(cart);
      if (entries.length === 0) return alert('Добавьте товары в корзину!');

      let orderText = "🛒 Новый заказ из Mini App:\n\n";
      let total = 0;
      entries.forEach(([id, qty], idx) => {
        const prod = PRODUCTS.find(p => p.id === id);
        if (!prod) return;
        const sum = prod.price * qty;
        total += sum;
        orderText += `${idx + 1}. ${prod.series} (${prod.flavor}) x${qty} = ${sum.toFixed(2)} Br\n`;
      });
      orderText += `\n💵 Итого к оплате: ${total.toFixed(2)} Br`;

      if (tg && tg.sendData) {
        tg.sendData(orderText);
      } else {
        alert(orderText.replace(/\\n/g, '\n'));
      }
      closeCart();
    }

    // Initial render
    filterProducts();
  </script>
