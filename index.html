.act{display:flex;align-items:center;gap:8px;min-width:104px;justify-content:flex-end}

tabs();$('.tabs').style.display=S.b===null?'flex':'none';
if(tg){S.b===null?tg.BackButton.hide():tg.BackButton.show()}
if(S.b===null){
 if(!q){app.innerHTML=`<div class="grid">${DATA[c].map((_,b)=>brandCard(c,b)).join('')}</div>`;return}
 let h='',n=0;const bm=DATA[c].map((_,b)=>b).filter(b=>DATA[c][b].n.toLowerCase().includes(q));
 if(bm.length)h+=`<div class="grid" style="margin-bottom:16px">${bm.map(b=>brandCard(c,b)).join('')}</div>`;
 DATA[c].forEach((br,b)=>br.it.forEach((x,i)=>{if(n<80&&(x[1].toLowerCase().includes(q))){h+=row(c,b,i,1);n++}}));
 app.innerHTML=h||'<div class="empty">Ничего не нашли.<br>Попробуйте другое слово</div>';return}
const br=DATA[c][S.b],lines=[...new Set(br.it.map(x=>x[0]))];
let h=`<div class="hero" style="--h:${hue(br.n)}"><button class="back" data-back>‹ Все марки</button><h1>${esc(br.n)}</h1><p>${pl(br.it.length,CAT[c].w)}${lines.length>1?' · '+pl(lines.length,CAT[c].l):''}</p></div>`;
if(lines.length>1)h+=`<div class="chips"><button class="chip ${S.line?'':'on'}" data-line="">Все</button>${lines.map(l=>`<button class="chip ${S.line===l?'on':''}" data-line="${esc(l)}">${esc(l)} <small>${br.it.filter(x=>x[0]==l).length}</small></button>`).join('')}</div>`;
let r='';br.it.forEach((x,i)=>{if((!S.line||x[0]===S.line)&&(!q||x[1].toLowerCase().includes(q)))r+=row(c,S.b,i,0)});
app.innerHTML=h+(r||'<div class="empty">Ничего не нашли</div>')}
function bar(){let n=0,t=0;for(const id in cart){n+=cart[id];t+=cart[id]*item(id).price}
$('#bar').classList.toggle('show',n>0);$('#bc').textContent='Корзина · '+n+' шт.';$('#bt').textContent=fmt(Math.round(t*10)/10);return[n,t]}
function sheet(){let h='<h2>Ваш заказ<button data-close>Закрыть</button></h2>',t=0;
for(const id in cart){const x=item(id);t+=x.price*cart[id];h+=`<div class="row" data-id="${id}"><div class="i"><div class="n">${esc(x.name)}</div><div class="s">${esc(x.br)} · ${esc(x.line)}</div></div><div class="p">${fmt(x.price*cart[id])}</div><div class="act">${act(id)}</div></div>`}
$('#sh').innerHTML=h+`<div class="tot"><span>Итого</span><span>${fmt(Math.round(t*10)/10)}</span></div><button class="go" data-go>Отправить заказ менеджеру</button>`}
function order(){let t=0,m='Здравствуйте! Хочу заказать:\n';
for(const id in cart){const x=item(id),s=x.price*cart[id];t+=s;m+=`• ${x.br} — ${x.name} (${x.line}) ×${cart[id]} = ${fmt(s)}\n`}
m+='\nИтого: '+fmt(Math.round(t*10)/10);const u=`https://t.me/${CFG.manager}?text=${encodeURIComponent(m)}`;
tg&&tg.openTelegramLink?tg.openTelegramLink(u):window.open(u,'_blank')}
const back=()=>{S.b=null;S.line='';S.q='';$('#q').value='';render();scrollTo(0,0)};
document.addEventListener('click',e=>{const t=e.target.closest('button,.bc');if(!t)return;
 if(t.dataset.cat){S.cat=t.dataset.cat;S.q='';$('#q').value='';return render()}
 if(t.dataset.b!==undefined){S.b=+t.dataset.b;S.line='';S.q='';$('#q').value='';render();return scrollTo(0,0)}
 if('back' in t.dataset)return back();
 if('line' in t.dataset){S.line=t.dataset.line;return render()}
 if(t.id=='bar'){sheet();return $('#ov').classList.add('show')}
 if('close' in t.dataset)return $('#ov').classList.remove('show');
 if('go' in t.dataset)return order();
 if(t.dataset.d){const w=t.closest('.row'),id=w.dataset.id,q=(cart[id]||0)+ +t.dataset.d;
  q>0?cart[id]=q:delete cart[id];save();tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred('light');
  document.querySelectorAll(`.row[data-id="${id}"] .act`).forEach(a=>a.innerHTML=act(id));
  if($('#ov').classList.contains('show')){const[n]=bar();n?sheet():$('#ov').classList.remove('show')}else bar()}});
$('#ov').addEventListener('click',e=>{if(e.target.id=='ov')$('#ov').classList.remove('show')});
$('#q').addEventListener('input',e=>{S.q=e.target.value;render()});
$('#shop').textContent=CFG.shop;document.title=CFG.shop;
for(const id in cart){try{item(id)}catch(e){delete cart[id]}}
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#14101d');tg.setBackgroundColor('#14101d')}catch(e){}tg.BackButton.onClick(back)}
render();bar();
</script>
</body>
</html>
